name: Deploy to staging

on:
  push:
    branches:
      - main

jobs:
  tests:
    name: 'Run lint and tests'
    uses: ./.github/workflows/test.yaml
  
  build-and-push:
    name: 'Build and push to registry'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - name: Build backend
        id: build-backend
        uses: redhat-actions/buildah-build@v3
        with:
          image: ohtuilmo-backend
          tags: staging ${{ github.sha }}
          context: backend/
          containerfiles: |
            backend/Dockerfile
          build-args: NODE_ENV="staging"

      - name: Build frontend
        id: build-frontend
        uses: redhat-actions/buildah-build@v3
        with:
          image: ohtuilmo-frontend
          tags: staging ${{ github.sha }}
          context: frontend/
          containerfiles: |
            frontend/Dockerfile
          build-args: NODE_ENV="staging"

      - name: Push backend to registry.version.helsinki.fi
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-backend.outputs.image }}
          tags: ${{ steps.build-backend.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      - name: Push frontend to registry.version.helsinki.fi
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-frontend.outputs.image }}
          tags: ${{ steps.build-frontend.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
