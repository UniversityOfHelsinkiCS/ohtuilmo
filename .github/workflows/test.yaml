name: Run tests

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]

jobs:
  lint_and_format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js for backend
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies, lint & format
        working-directory: ./backend
        run: |
          npm ci
          npm run lint
          npm run format:check

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies, lint & format
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run format:check

  backend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js for backend
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start db container
        run: docker compose -f compose.ci.yaml up db -d

      - name: Create and migrate
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/dev_postgres
        run: |
          cd backend
          npm ci
          npm run db:create
          npm run db:migrate

      - name: Run backend unit tests
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/dev_postgres
          SECRET: testsecret
          PORT: 3001
        run: |
          cd backend
          npm run test

  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start db container
        run: docker compose -f compose.ci.yaml up db -d

      - name: Create, migrate and seed db
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/dev_postgres
        run: |
          cd backend
          npm ci
          npm run db:create
          npm run db:migrate
          npm run db:seed:all

      - name: Start backend, frontend and nginx
        run: docker compose -f compose.ci.yaml up backend frontend nginx -d

      - name: Install frontend dependencies and Playwright browser
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the app
        run: timeout 120 sh -c 'until curl -fsS http://localhost:3000/projekti/ >/dev/null; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: ./frontend
        env:
          E2E_BASE_URL: http://localhost:3000/projekti
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/e2e/test-results
          retention-days: 7
