name: Run tests

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  lint_and_format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js for backend
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install backend dependencies, lint & format
        working-directory: ./backend
        run: |
          npm ci
          npm run lint
          npm run format:check

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies, lint & format
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run format:check

  backend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js for backend
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start db container
        run: docker compose -f compose.ci.yaml up db -d

      - name: Create and migrate
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/dev_postgres
        run: |
          cd backend
          npm ci
          npm run db:create
          npm run db:migrate

      - name: Run backend unit tests
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/dev_postgres
          SECRET: testsecret
          PORT: 3001
        run: |
          cd backend
          npm run test

  cypress:
    name: cypress (group ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      # Specs are split into parallel groups by their run time. Groups 1-3 list the
      # slow specs explicitly, group 4 runs every spec not listed, so new specs are
      # always included.
      - name: Select specs for this group
        id: specs
        env:
          GROUP_1: topicListPage
          GROUP_2: instructorReview groupManagementPage emailConfigurationPage
          GROUP_3: timeLogs reviewQuestionsPage customerReviewQuestionsPage registrationQuestionsPage
        run: |
          dir=frontend/e2e/cypress/integration
          case "${{ matrix.group }}" in
            1) names="$GROUP_1" ;;
            2) names="$GROUP_2" ;;
            3) names="$GROUP_3" ;;
            *)
              listed=" $GROUP_1 $GROUP_2 $GROUP_3 "
              names=""
              for f in "$dir"/*.spec.js; do
                name=$(basename "$f" .spec.js)
                case "$listed" in
                  *" $name "*) ;;
                  *) names="$names $name" ;;
                esac
              done
              ;;
          esac
          specs=""
          for name in $names; do
            if [ ! -f "$dir/$name.spec.js" ]; then
              echo "Spec $dir/$name.spec.js listed in the workflow does not exist" >&2
              exit 1
            fi
            specs="$specs,e2e/cypress/integration/$name.spec.js"
          done
          echo "Running specs: ${specs#,}"
          echo "specs=${specs#,}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for initializing db with backend's npm scripts
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start db container
        run: docker compose -f compose.ci.yaml up db -d

      - name: Create, migrate and seed db
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/dev_postgres
        run: |
          cd backend
          npm ci
          npm run db:create
          npm run db:migrate
          npm run db:seed:all

      - name: Start backend, frontend and nginx
        run: docker compose -f compose.ci.yaml up backend frontend nginx -d

      - name: Setup Node.js for initializing db with backend's npm scripts
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./frontend
          config: baseUrl=http://localhost:3000/projekti
          install-command: npm ci && npx cypress install
          browser: chrome
          spec: ${{ steps.specs.outputs.specs }}
